nt-weight:600;font-size:13px;letter-spacing:0.16em;color:#334155\">INTERVALO<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fmain>\n\n<!-- Footer -->\n<footer style=\"background:#0B192C;border-top:4px solid #F97316;color:#F8FAFC\">\n<div style=\"max-width:1180px;margin:0 auto;padding:32px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px\">\n<span style=\"font-family:'Outfit',sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.012em\">TES 2026 <span style=\"font-weight:300;color:#CBD5E1\">· Tendências em Engenharia de Software<\u002Fspan><\u002Fspan>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.10em;color:#94A3B8\">CHAIR · PROF. KARINA KOHL · INSTITUTO DE INFORMÁTICA · UFRGS<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3700}}\">\nclass Component extends DCLogic {\n  get papersData() {\n    return [{\"id\": \"38809\", \"title\": \"Do Longer Task Lists Name More Missing Files? Recorded File Existence in SpecMine’s OpenSpec Index\", \"authors\": [{\"name\": \"Luciano Andrade\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"OpenSpec task lists (tasks.md) name the repository files that a planned change should touch. The MSR 2027 Mining Challenge asks how often such files exist and whether the gap grows with specification length. We answer for SpecMine v1.0 with a repository mining study of its OpenSpec reference index: 435,401 references from 62,472 task lists in 7,076 repositories, each with a recorded existence flag. The index flags 82.9% of references as existing, 11.9% as absent, and 5.1% as unknown (12.6% absent among known states). References in unchecked tasks are flagged absent about twice as often as those in checked tasks (21.9% versus 10.3%). Across 60,811 eligible lists, the mean per-list absence proportion rises from 8.74% in the shortest length quartile to 15.81% in the longest, a difference of 7.07 percentage points (95% repository-bootstrap interval: 5.71–8.39) that persists under all reported sensitivity checks. The rise reflects more lists with at least one absent file (14.58% to 47.18%), not larger absent shares within affected lists, and the median list has no absent reference in any quartile. The findings are reproducible properties of recorded flags; they do not establish implementation gaps or a causal effect of length.\", \"keywords\": [], \"lang\": \"EN\"}, {\"id\": \"38824\", \"title\": \"What Does a Missing Spec-to-Code Path Mean? Evidence from OpenSpec Tasks\", \"authors\": [{\"name\": \"Pedro de Paula Odorize\", \"aff\": \"UFRGS, Brasil\"}, {\"name\": \"Ignacio Figueredo\", \"aff\": \"PPGC/UFRGS, Brasil\"}], \"abstract\": \"A path mentioned in a software task can be absent because it has yet to be created, was moved or deleted, belongs elsewhere, or names no file at all. SpecMine records 51,979 OpenSpec task-to-code references whose literal paths are absent at their reference commits, but does not distinguish these meanings. We introduce a rule-based classification framework and a 90-reference benchmark labeled independently by two human reviewers and reconciled by consensus (the Human Gold) to evaluate its application by an LLM-based classification agent with repository-investigation tools. After 82/90 agreement with the Human Gold (κ = 0.8782), the agent classified a 382-reference probability sample with an approximately five-percentage-point maximum sampling margin at 95% confidence. Agent-assigned estimates indicate that expected creation and expected move or deletion together account for 52.9% of the absent-reference frame, showing that many absences are consistent with planned task evolution. Non-file and external-repository interpretations account for a further 27.2%, while problematic absence accounts for 3.4% and inaccessible or invalid cases for 13.1%. Creation assignments are more frequent in open than completed tasks (49.2% versus 26.6%), a descriptive pattern consistent with more forward-looking work. These percentages describe agent-assigned interpretations. Their intervals capture sampling variation only and do not include classification error. We release the Human Gold, the probability-sampled agent-labeled dataset, the classification framework, and case-level provenance. A missing path alone does not establish a defect.\", \"keywords\": [], \"lang\": \"EN\"}, {\"id\": \"38827\", \"title\": \"Supervisão Automática Calibrada e Reranking para Recuperação de Código-Fonte em Desenvolvimento Orientado por Especificações\", \"authors\": [{\"name\": \"Mara Magda Soares\", \"aff\": \"UFRGS, Brasil\"}, {\"name\": \"Adí Kauan da Cunha dos Santos\", \"aff\": \"\"}, {\"name\": \"Augusto Arrojo de Deus\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"Este trabalho investiga se a supervisão automática, calibrada por uma implementação independente inspirada no método LLM-Assisted Relevance Assessments, melhora a recuperação de arquivos de código-fonte associados a especificações de desenvolvimento orientado por especificações. O estudo compara o BM25, representante da recuperação lexical, e o Jina Code Embeddings 0.5B, representante da recuperação semântica, em configurações originais e com reordenação supervisionada. A abordagem proposta utiliza um modelo de linguagem para estimar a relevância de pares especificação–arquivo e uma estratégia de calibração inspirada no LLM-Assisted Relevance Assessments para selecionar e ajustar julgamentos sob orçamento limitado. Os julgamentos calibrados supervisionam reordenadores independentes, sem alterar a formulação do BM25 nem ajustar os parâmetros dos embeddings do Jina. O corpus é derivado do SpecMine e concentra-se nos frameworks Spec Kit e OpenSpec e nas linguagens Go, Python e TypeScript. Na ausência de avaliadores humanos, a avaliação utiliza uma referência indireta baseada na participação dos arquivos nas mudanças registradas em solicitações de integração. Essa referência mede o envolvimento retrospectivo nas mudanças, não a relevância semântica completa para a especificação. As etapas de auditoria da base, implementação da calibração e preparação do protocolo experimental foram concluídas; a reconstrução dos corpora históricos e a avaliação de eficácia ainda estão em andamento. Os resultados disponíveis demonstram a viabilidade do pipeline, mas não permitem concluir que a supervisão calibrada melhora o desempenho dos recuperadores.\", \"keywords\": [\"Recuperação de código-fonte\", \"Desenvolvimento orientado por especificações\", \"Reranking\", \"BM25\", \"Avaliação de relevância\"], \"lang\": \"PT\"}, {\"id\": \"38832\", \"title\": \"What Do Agent Skills Ask Agents to Do? A Security-Capability Census of GitSkills\", \"authors\": [{\"name\": \"Arthur Kobielski\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"Agent skills are natural-language instruction files that AI coding agents load at run time and are copied between repositories without a registry or review. We measure which security-relevant capabilities skills request and ship, using the GitSkills sample (12,966 distinct skills, 29,680 occurrences). We define 14 conservative detectors for instructions and bundled scripts and validate them on 184 labelled hits (precision 0.73–1.00, except injection phrases, which we report separately). Beyond routine shell use (39.6%), 13.5% of skills ask the agent to handle credentials, reach the network, escalate privileges, run destructive or remote code, or act without confirmation; 10.7% bundle scripts, about half of which perform process execution, network access, or secret reads, and 23.4% of those risky scripts are never mentioned in the SKILL.md an agent reads. Capability bearing skills are copied at practically the same rate as others (negligible effect sizes), so risk propagates without being selected against. Skills whose commits carry AI co-authorship trailers are more likely to request sensitive capabilities (length-adjusted OR=1.29). We also find deliberately poisoned skills in research corpora, which future mining studies must filter.\", \"keywords\": [], \"lang\": \"EN\"}, {\"id\": \"38834\", \"title\": \"Editing and Spec Decay in Spec-Driven Development\", \"authors\": [{\"name\": \"João Laureano\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"Spec-driven development (SDD) is an emerging practice in which natural-language specifications guide coding agents. Using SpecMine v1.0, we study how these specifications evolve after creation: how often they are revised, and how often code changes leave them outdated. We measure edit rates by tool and read 280 pairs of an OpenSpec living specification and a later pull request that changed linked code without updating it. Most specs had no later commit by July 11, 2026. OpenSpec living specs were edited more often than Spec Kit specs, although the difference was small. Of the 270 judgeable pairs, the mean per-repository share whose spec became false was 5.4%; counting specs that also failed to describe new behavior within their scope raised it to 10.6%. In 11 pairs, the changed behavior was outside the focal spec's scope, and our search found no other spec describing it. Treating these gaps as decay raised the estimate to 14.9% (95% CI 9.5–20.8).\", \"keywords\": [], \"lang\": \"EN\"}, {\"id\": \"38838\", \"title\": \"What Are Agent Skills For? A Topic Model of 44,082 SKILL.md Descriptions in GitSkills\", \"authors\": [{\"name\": \"Rafael Silveira Machado\", \"aff\": \"Instituto de Informatica UFRGS, Brasil\"}], \"abstract\": \"Agent skills are folders whose SKILL.md file tells a coding agent how to perform a class of tasks. The agent decides whether to load a skill by matching the task at hand against the skill's short natural-language description, so the description defines what the skill is for. Although millions of skill files exist on GitHub, no taxonomy of their purposes is available. Using the GitSkills dataset, we apply BERTopic to a random sample of 44,082 unique English skill descriptions and identify 30 topics in nine categories. Development workflow and quality dominates (25.9% of descriptions), led by code review, planning, and specifications (17.2%), followed by skills about the agent ecosystem itself, such as configuring agents, building tool servers, and managing agent memory (13.7%). Skills about specific programming languages are rare (7.1%), suggesting that developers use skills to encode procedures rather than language knowledge. Two topics consist largely of near-identical, machine-generated descriptions that inflate skill counts without adding distinct purposes. Topic distributions vary only negligibly with the repository's primary language, popularity, and reuse. These findings imply that many skills with overlapping purposes compete for the agent's selection, so descriptions should state what distinguishes a skill, not only what it does. Skill catalogs could organize skills by our taxonomy and flag templated descriptions, and researchers can use it to sample skills by purpose in studies of quality and security. We release our notebook, topic assignments, and labels.\", \"keywords\": [\"agent skills\", \"coding agents\", \"topic modeling\", \"BERTopic\", \"mining software repositories\"], \"lang\": \"EN\"}, {\"id\": \"38846\", \"title\": \"Greenfield vs. Brownfield Spec-Driven Development: An Analysis of Pull Request Resolution Time in SpecMine\", \"authors\": [{\"name\": \"Henrique Candaten\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"As Spec-Driven Development (SDD) gains adoption in the software engineering landscape, understanding how different projects relate to its introduction has become a relevant object of study. To contribute to the research on this emerging way of developing software, we conducted a quantitative analysis of how the resolution time of pull requests (PRs) that change code differs between greenfield and brownfield projects. We used the SpecMine dataset, a corpus of spec-driven development artefacts made available for the MSR Mining Challenge 2027, as the data source. The data considered relevant to our the investigation included the merged PRs that changed code, the time interval between the creation of these PRs and their merging, and the gap in days between repository creation and the first commit of a spec artefact. Repositories with gaps between -7 and 7 days were classified as greenfield, while those with gaps of at least 90 days were classified as brownfield. The gap was computed for 72,844 repositories; those with a gap within ±7 days (53,152) were classified as greenfield and those with a gap of at least 90 days (7,974) as brownfield, while the rest were excluded as ambiguous. However, only 5,992 PRs were available in the dataset, and 4,866 of these were both merged and code-changing. This means that a small number of repositories had PRs available for analysis, leaving us with 334 brownfield repositories (2,712 PRs) and 104 greenfield repositories (1,368 PRs). Brownfield PRs had a longer median resolution time than greenfield PRs (3.3 h vs. 0.4 h). A mixed-effects model with a repository-level random intercept estimated that brownfield PRs took approximately 5.4 times longer to merge, with the difference decreasing to approximately 2.8 times after controlling for PR size, tool, language, repository popularity, owner type, and number of authors. The association is stable across alternative thresholds, and the time grows with the gap when it is treated as a continuous variable. The results indicate that, among SDD adopters, introducing SDD into an existing project is consistently associated with slower code-changing PRs than adopting it at project beginning, even after accounting for several PR- and repository-level characteristics. In addition, PRs that change both specs and code appear in about 4% of brownfield repositories but only 0.2% of greenfield ones, suggesting that spec-driven changes reach the pull-based workflow mainly in projects that already existed. As the dataset contains only SDD adopters, we do not claim that SDD causes the difference.\", \"keywords\": [], \"lang\": \"EN\"}, {\"id\": \"38847\", \"title\": \"Agent Skills as an Informal Supply Chain: Reuse and Security Drift on GitHub\", \"authors\": [{\"name\": \"Cleber Souza\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"Agent skills are natural-language instructions, often bundled with scripts, that coding agents built on large language models follow with their users' permissions. Skills spread by copying files between repositories rather than through a package registry, so an edited copy can silently change what an agent is told. This study characterizes this informal supply chain and asks whether edited copies change the security-sensitive capabilities that skills grant to agents. We analyze 3.8 million skill files from 282,200 public GitHub repositories, measuring authorship, reuse concentration, and capability drift. Distinctively, we track drift across copies: we group edited copies sharing a skill name into variant families, compare each variant with its family's most-copied version, and validate the capability detectors on a labelled sample. Reuse is concentrated: 1% of skill contents account for 27% of all copies, two thirds of copied skills cross repository owners, and one in three skills is first committed with an artificial intelligence assistant as co-author. Copying does not make skills riskier overall: edits remove most capability types more often than they add. The exception is piping a downloaded script directly into a shell, the most reliably detected capability, which is added more often than removed. Validation also shows that keyword detection overestimates capabilities such as credential handling, which skills often mention only to forbid. These results imply that reviewing every copied skill is unnecessary: provenance tracking and checks focused on remote code execution would address the risk that does accumulate, and detectors must distinguish instructions from prohibitions.\", \"keywords\": [\"agent skills\", \"large language model (LLM) coding agents\", \"software reuse\", \"software supply chain security\", \"mining software repositories (MSR)\"], \"lang\": \"EN\"}, {\"id\": \"38849\", \"title\": \"Marcada, mas ausente: lacunas de rastreabilidade entre tarefas e código no OpenSpec\", \"authors\": [{\"name\": \"Felipe Thomas\", \"aff\": \"Instituto Federal Sul-Rio-Grandense - Campus Charqueadas, Brasil\"}], \"abstract\": \"À medida que agentes de código se tornam capazes de planejar, editar, testar e depurar repositórios com intervenção humana limitada, comunicar a intenção de desenvolvimento passa a ser um desafio central. O desenvolvimento orientado por especificação (SDD) responde a essa demanda ao transformar uma especificação escrita no artefato a partir do qual a implementação procede. Ferramentas como o OpenSpec decompõem uma mudança em um checklist tasks.md, cujos itens nomeiam os arquivos que se espera modificar. Quando um único agente redige o checklist, implementa a mudança e marca as caixas de conclusão, o documento registra apenas o que o agente acredita ter feito; até hoje, porém, nunca se mediu em escala se esse registro corresponde ao repositório. Estudamos 435.401 alegações de tarefa para código, extraídas de 62.472 arquivos tasks.md em 7.076 repositórios públicos do corpus SpecMine (MSR 2027 Mining Challenge). Após auditar a extração dos caminhos indicados, verificamos que 9,11% das alegações marcadas como concluídas nomeiam um arquivo ausente no commit de ancoragem. Essa proporção cresce monotonicamente com o tamanho da lista de tarefas, passando de 4,31% (1 a 5 tarefas) para 13,26% (acima de 50 tarefas), e o gradiente persiste mesmo sob efeitos fixos de repositório. Ao reinspecionar 565 alegações no HEAD dos repositórios meses depois, 71,9% permanecem ausentes, o que resulta em uma estimativa composta de 6,55% de alegações marcadas sem artefato correspondente no HEAD. Uma caixa marcada, portanto, é um indicador frágil de progresso.\", \"keywords\": [], \"lang\": \"PT\"}, {\"id\": \"38850\", \"title\": \"GitHub Account Age and Spec-Driven Development Practices: An Analysis of Open Items, Traceability, and Scenario Detail\", \"authors\": [{\"name\": \"Isadora Fraga\", \"aff\": \"\"}, {\"name\": \"Luísa Bolzan\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"Spec-Driven Development (SDD) proposes that natural-language specifications guide software development and, combined with AI coding agents such as Claude Code and Codex, is being adopted by developers with different levels of experience. The quality of these specifications, such as anticipating edge cases, defining acceptance criteria, and detailing scenarios, tends to influence the outcome of the implementation. This paper investigates whether GitHub account age, used as a proxy for observable experience, is associated with specification characteristics traditionally related to seniority: the presence of unresolved definitions (open items), the link to existing code (traceability), and the level of scenario detail. To this end, we analyze 215,114 specifications written by 11,741 authors in the SpecMine v1.0 dataset (MSR 2027 Mining Challenge). To prevent results from reflecting template differences, we restrict the analysis to English-language specifications and examine separately the two most widely used tools, OpenSpec and Spec Kit. Measures are aggregated per author and related to account age, treated as a continuous variable, using Spearman’s rank correlation. We report the direction and magnitude of these associations for each tool and discuss their implications for SDD use by developers with different levels of experience.\", \"keywords\": [], \"lang\": \"EN\"}, {\"id\": \"38852\", \"title\": \"Measuring the Done-but-Missing Reference-to-Code Gap in OpenSpec\", \"authors\": [{\"name\": \"Leticia Batista\", \"aff\": \"UFRGS, Brasil\"}, {\"name\": \"Andrew Paes da Silva\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"AI coding agents increasingly implement software from natural-language specifications, yet whether a task a specification marks as done corresponds to code that actually exists has not been measured at scale. We examined this question using the OpenSpec subset of the SpecMine corpus of spec-driven development (SDD) artifacts. Of 332,168 completed task references with a resolved anchor commit, 10.3% had no corresponding code at that commit, with rates of 17.7% for active changes and 9.0% for archived changes. We examined the syntactic form of these absent references and found that 91% had file-like paths rather than malformed or non-file-like forms. We then searched the recovered Git history of a stratified sample of 152 repositories, 137 of which were cloned successfully, to classify 1,298 references using a repository-history procedure. Among these, 54.5% showed no addition in the recovered history on any branch, and 29.5% had been added and subsequently removed before the anchor. The remaining references appeared only after the anchor (9.2%) or were classified as renamed or associated with an anchor commit unreachable in the recovered history (6.8%). These categories were assigned by the procedure and were not independently validated by human judges, and their composition also varied across repository popularity bands. The results indicate that a substantial share of completed OpenSpec tasks reference code for which no corresponding addition is found in the recovered repository history.\", \"keywords\": [], \"lang\": \"EN\"}, {\"id\": \"38853\", \"title\": \"How Do Specifications Evolve in Spec-Driven Development? An Empirical Study of Their Lifecycle\", \"authors\": [{\"name\": \"Nikolas Santos\", \"aff\": \"UFRGS, Brasil\"}], \"abstract\": \"No desenvolvimento guiado por especificações (spec-driven development, SDD), especificações em linguagem natural podem atuar como referências centrais para agentes de IA ao longo do desenvolvimento e da evolução de um projeto. Entretanto, dados do corpus SpecMine indicam que a maioria das especificações possuem apenas um commit registrado, levantando uma questão ainda pouco explorada: essas especificações representam artefatos concluídos e estáveis ou evidenciam processos de especificação interrompidos? Neste trabalho, investigamos o ciclo de vida de artefatos de SDD a partir de três dimensões: (i) especificações potencialmente desatualizadas, que deixam de evoluir enquanto o repositório continua ativo; (ii) trabalho potencialmente inacabado, identificado por indícios de tarefas não concluídas ou alterações que não foram formalmente encerradas; e (iii) interrupção da prática de especificação, caracterizada por repositórios que deixam de produzir novos artefatos de especificação, embora continuem em desenvolvimento.\", \"keywords\": [], \"lang\": \"PT\"}];\n  }\n\n  renderVals() {\n    const s = this.state || {};\n    const tab = s.tab || 'papers';\n    const q = (s.query || '').trim().toLowerCase();\n    const open = s.open || {};\n    const all = this.papersData;\n    const list = all.filter((p) => !q || (p.id + ' ' + p.title + ' ' + p.authors.map((a) => a.name).join(' ')).toLowerCase().includes(q));\n\n    const base = \"background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:20px 0 16px;min-height:56px;font-family:'Outfit',sans-serif;font-size:19px;letter-spacing:-0.012em;\";\n    const on = base + 'font-weight:600;color:#0B192C;border-bottom-color:#EA580C;';\n    const off = base + 'font-weight:400;color:#64748B;';\n\n    const sessions = [\n      { tag: 'SESSION 1', title: 'Evolving specs: lifecycle and practices in Spec-Driven Development',\n        desc: 'In Spec-Driven Development, the specification stops being a document written once and forgotten, and starts guiding the work of people and agents throughout the whole project. But what happens to these specs after they are created? This session follows the trajectory of specifications over time: how they evolve, when and why they degrade, and how context shapes practice, whether the type of project (greenfield or brownfield) or the profile of those who develop. The papers analyze real data from GitHub repositories to understand how SDD happens in practice, not only how it is prescribed.',\n        papers: [\n          { id: '38853', title: 'How Do Specifications Evolve in Spec-Driven Development? An Empirical Study of Their Lifecycle', authors: 'Nikolas Santos (UFRGS)' },\n          { id: '38834', title: 'Editing and Spec Decay in Spec-Driven Development', authors: 'João Laureano (UFRGS)' },\n          { id: '38846', title: 'Greenfield vs. Brownfield Spec-Driven Development: An Analysis of Pull Request Resolution Time in SpecMine', authors: 'Henrique Candaten (UFRGS)' },\n          { id: '38850', title: 'GitHub Account Age and Spec-Driven Development Practices: An Analysis of Open Items, Traceability, and Scenario Detail', authors: 'Isadora Fraga, Luísa Bolzan (UFRGS)' } ] },\n      { tag: 'SESSION 2', title: 'Done, but not found: traceability gaps between spec and code in OpenSpec',\n        desc: 'A task marked as completed should correspond to something in the code. This session investigates the cases where that correspondence fails: tasks reported as done that reference files or paths that do not exist in the repository. Drawing on SpecMine’s OpenSpec index, the four papers approach this gap from complementary angles. They propose ways to measure it, characterize where it appears, discuss what a missing path really means, and examine factors associated with it. Together, they help us understand how far we can trust what specs say about the code.',\n        papers: [\n          { id: '38852', title: 'Measuring the Done-but-Missing Reference-to-Code Gap in OpenSpec', authors: 'Leticia Batista, Andrew Paes da Silva (UFRGS)' },\n          { id: '38849', title: 'Marcada, mas ausente: lacunas de rastreabilidade entre tarefas e código no OpenSpec', authors: 'Felipe Thomas (IFSul – Campus Charqueadas)' },\n          { id: '38824', title: 'What Does a Missing Spec-to-Code Path Mean? Evidence from OpenSpec Tasks', authors: 'Pedro de Paula Odorize, Ignacio Figueredo (UFRGS)' },\n          { id: '38809', title: 'Do Longer Task Lists Name More Missing Files? Recorded File Existence in SpecMine’s OpenSpec Index', authors: 'Luciano Andrade (UFRGS)' } ] },\n      { tag: 'SESSION 3', title: 'Skills and agents: code retrieval and the Agent Skills ecosystem',\n        desc: 'AI agents depend as much on finding the right code as on the instructions they receive. The session begins with this first challenge, through a specification-driven approach to source-code retrieval. It then turns to Agent Skills, the SKILL.md files that developers create and share to extend what agents can do. Using the GitSkills dataset, the papers map what these skills are for, which capabilities and security risks they involve, and how reuse across repositories forms an informal supply chain, with little curation and implications that remain largely unexplored.',\n        papers: [\n          { id: '38827', title: 'Supervisão Automática Calibrada e Reranking para Recuperação de Código-Fonte em Desenvolvimento Orientado por Especificações', authors: 'Mara Magda Soares, Adí Kauan da Cunha dos Santos, Augusto Arrojo de Deus (UFRGS)' },\n          { id: '38838', title: 'What Are Agent Skills For? A Topic Model of 44,082 SKILL.md Descriptions in GitSkills', authors: 'Rafael Silveira Machado (UFRGS)' },\n          { id: '38832', title: 'What Do Agent Skills Ask Agents to Do? A Security-Capability Census of GitSkills', authors: 'Arthur Kobielski (UFRGS)' },\n          { id: '38847', title: 'Agent Skills as an Informal Supply Chain: Reuse and Security Drift on GitHub', authors: 'Cleber Souza (UFRGS)' } ] }\n    ];\n\n    const grid = 'display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;';\n    const none = { isOpening: false, isSession: false, isSlot: false, isBreak: false, hasTime: true, time: '', tag: '', title: '', desc: '', label: '', id: '', authors: '' };\n    const opening = (time) => Object.assign({}, none, { isOpening: true, time, rowStyle: grid + 'align-items:center;background:#F8FAFC;' });\n    const brk = (time) => Object.assign({}, none, { isBreak: true, time, rowStyle: grid + 'align-items:center;background:#F8FAFC;' });\n    const session = (s) => Object.assign({}, none, { isSession: true, hasTime: false, tag: s.tag, title: s.title, desc: s.desc, rowStyle: 'display:grid;grid-template-columns:minmax(0,1fr);background:#FAF8F5;box-shadow:inset 6px 0 0 #F97316;' });\n    const slot = (n, time, p) => Object.assign({}, none, { isSlot: true, time, label: 'SLOT ' + n, id: p.id, title: p.title, authors: p.authors, rowStyle: grid + 'align-items:start;background:#FFFFFF;' });\n\n    const days = [\n      { tag: 'DAY 1', date: 'Wed, Nov 25', count: 8, rows: [\n        opening('13:30'), session(sessions[0]),\n        slot(1, '13:50', sessions[0].papers[0]), slot(2, '14:10', sessions[0].papers[1]), slot(3, '14:30', sessions[0].papers[2]), slot(4, '14:50', sessions[0].papers[3]),\n        brk('15:10'), session(sessions[1]),\n        slot(5, '15:30', sessions[1].papers[0]), slot(6, '15:50', sessions[1].papers[1]), slot(7, '16:10', sessions[1].papers[2]), slot(8, '16:30', sessions[1].papers[3]) ] },\n      { tag: 'DAY 2', date: 'Wed, Dec 2', count: 4, rows: [\n        opening('13:30'), session(sessions[2]),\n        slot(1, '13:40', sessions[2].papers[0]), slot(2, '14:00', sessions[2].papers[1]), slot(3, '14:20', sessions[2].papers[2]), slot(4, '14:40', sessions[2].papers[3]) ] }\n    ];\n\n    return {\n      isPapers: tab === 'papers',\n      isProgram: tab === 'program',\n      papersTabStyle: tab === 'papers' ? on : off,\n      programTabStyle: tab === 'program' ? on : off,\n      goPapers: () => this.setState({ tab: 'papers' }),\n      goProgram: () => this.setState({ tab: 'program' }),\n      query: s.query || '',\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      total: all.length,\n      shown: list.length,\n      noResults: list.length === 0,\n      slotCount: 12,\n      days,\n      papers: list.map((p) => {\n        const isOpen = !!open[p.id];\n        return Object.assign({}, p, {\n          isOpen,\n          glyph: isOpen ? '−' : '+',\n          toggleLabel: isOpen ? 'HIDE ABSTRACT' : 'SHOW ABSTRACT',\n          hasKeywords: p.keywords.length > 0,\n          toggle: () => this.setState({ open: Object.assign({}, open, { [p.id]: !isOpen }) })\n        });\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
