<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}
.tile{display:flex;width:1280px;height:854px}
.main{flex:1;background:#0B192C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.main img{width:420px}
.name{font-family:var(--font-display);font-weight:700;font-size:112px;line-height:1;letter-spacing:-.035em;color:#F8FAFC;white-space:nowrap}
.name span{font-weight:300}
.strip{width:320px;display:flex;flex-direction:column}
.strip i{flex:1;display:block}</style></head>
<body><div class="tile">
<div class="main"><img src="assets/seresearch-mark.png" alt=""><div class="name">SEResearch<span> Lab</span></div></div>
<div class="strip"><i style="background:#FDBA74"></i><i style="background:#FB923C"></i><i style="background:#F97316"></i><i style="background:#EA580C"></i></div>
</div></body></html>
