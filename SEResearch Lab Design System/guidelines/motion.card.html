<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}</style></head><body><div style="font-family:var(--font-mono);font-size:12px;color:var(--text-body);display:grid;grid-template-columns:1fr 1fr;gap:8px 28px">
<div>--duration-instant<span style="color:var(--text-accent);float:right">90ms</span></div><div>press feedback</div>
<div>--duration-fast<span style="color:var(--text-accent);float:right">140ms</span></div><div>hover, focus, control state</div>
<div>--duration-base<span style="color:var(--text-accent);float:right">180ms</span></div><div>panel and tab changes</div>
<div>--duration-slow<span style="color:var(--text-accent);float:right">260ms</span></div><div>dialog entry</div>
<div>--ease-standard<span style="color:var(--text-accent);float:right">.2,0,0,1</span></div><div>everything, unless entering</div>
</div></body></html>
