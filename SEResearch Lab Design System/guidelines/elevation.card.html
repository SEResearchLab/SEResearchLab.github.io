<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Depth is hairlines first, shadow only when lifted" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}</style></head><body><div style="display:flex;gap:18px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:center">
<div><div style="width:130px;height:66px;background:var(--surface-card);border:2px solid var(--border-hairline)"></div><div style="margin-top:8px">--shadow-none<br>flat card</div></div>
<div><div style="width:130px;height:66px;background:var(--surface-card);box-shadow:var(--shadow-card)"></div><div style="margin-top:8px">--shadow-card<br>hover lift</div></div>
<div><div style="width:130px;height:66px;background:var(--surface-card);box-shadow:var(--shadow-overlay)"></div><div style="margin-top:8px">--shadow-overlay<br>dialog</div></div>
<div><div style="width:130px;height:66px;background:var(--surface-card);border:2px solid var(--border-hairline);box-shadow:var(--shadow-focus)"></div><div style="margin-top:8px">--shadow-focus<br>focus ring</div></div>
</div></body></html>
