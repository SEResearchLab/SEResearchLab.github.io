<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}</style></head><body><div style="display:flex;gap:14px"><div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;background:#15803D;border:1px solid var(--border-hairline)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text-strong)">#15803D</div><div style="font-size:11px;color:var(--text-muted);line-height:1.3">positive</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;background:#B45309;border:1px solid var(--border-hairline)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text-strong)">#B45309</div><div style="font-size:11px;color:var(--text-muted);line-height:1.3">warning</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;background:#B91C1C;border:1px solid var(--border-hairline)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text-strong)">#B91C1C</div><div style="font-size:11px;color:var(--text-muted);line-height:1.3">critical</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;background:#1E3E62;border:1px solid var(--border-hairline)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text-strong)">#1E3E62</div><div style="font-size:11px;color:var(--text-muted);line-height:1.3">info</div></div></div></body></html>
