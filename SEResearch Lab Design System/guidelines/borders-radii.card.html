<!-- @dsCard group="Spacing" viewport="700x160" name="Borders & radii" subtitle="The identity is square; pills are the exception" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}</style></head><body><div style="display:flex;gap:18px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:center">
<div><div style="width:90px;height:60px;border:2px solid var(--border-hairline);background:var(--surface-card)"></div><div style="margin-top:6px">card · 0px · 2px hairline</div></div>
<div><div style="width:90px;height:60px;background:var(--surface-paper);border:2px solid var(--border-hairline);border-left:6px solid var(--accent)"></div><div style="margin-top:6px">highlight · 6px bar</div></div>
<div><div style="width:90px;height:60px;border:2px solid var(--border-hairline);border-top:3px solid var(--rule-accent);background:var(--surface-card)"></div><div style="margin-top:6px">rule · 3px</div></div>
<div><div style="height:26px;border-radius:999px;background:var(--surface-sunken);border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center;padding:0 14px;color:var(--text-body)">pill</div><div style="margin-top:6px">badge · 999px</div></div>
</div></body></html>
