<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-family:var(--font-mono);font-size:11px">
<div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;background:var(--text-strong);border:1px solid var(--border-hairline);flex:none"></span><span style="color:var(--text-body)">--text-strong</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;background:var(--text-body);border:1px solid var(--border-hairline);flex:none"></span><span style="color:var(--text-body)">--text-body</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;background:var(--text-muted);border:1px solid var(--border-hairline);flex:none"></span><span style="color:var(--text-body)">--text-muted</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;background:var(--text-accent);border:1px solid var(--border-hairline);flex:none"></span><span style="color:var(--text-body)">--text-accent</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;background:var(--surface-card);border:1px solid var(--border-hairline);flex:none"></span><span style="color:var(--text-body)">--surface-card</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;background:var(--surface-sunken);border:1px solid var(--border-hairline);flex:none"></span><span style="color:var(--text-body)">--surface-sunken</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;background:var(--surface-paper);border:1px solid var(--border-hairline);flex:none"></span><span style="color:var(--text-body)">--surface-paper</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;background:var(--border-hairline);border:1px solid var(--border-hairline);flex:none"></span><span style="color:var(--text-body)">--border-hairline</span></div>
</div></body></html>
